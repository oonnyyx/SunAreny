# Wszystkie teksty SunAren (MiniMessage). Znaczniki w <nawiasach> podstawia plugin.
prefiks: "<gradient:#ffc02e:#ff7a1a><b>Areny</b></gradient> <dark_gray>»</dark_gray> "

tryby:
  spleef:
    nazwa: "Spleef nad Otchłanią"
    kolor: "#9be7ff"
    opis: "Rozkop śnieg pod rywalami. Kto spadnie, odpada."
  tntrun:
    nazwa: "TNT Run"
    kolor: "#ff7a1a"
    opis: "Bloki znikają ci spod nóg. Nie stój w miejscu!"
  krol:
    nazwa: "Król Wyspy"
    kolor: "#ffc02e"
    opis: "Utrzymaj się na szczycie. Zrzucaj innych kijem."

ogloszenie:
  zapisy: "<gray>⚔ Za <white><sekundy> s</white> startuje <color:<kolor>><b><tryb></b></color>! <click:run_command:'/arena dolacz'><hover:show_text:'<gray>Kliknij, żeby się zapisać'><#7ee081>[KLIKNIJ, ABY DOŁĄCZYĆ]</#7ee081></hover></click> <dark_gray>(<liczba>/<max>)"
